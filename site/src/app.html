<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Design, preview and share themes for Pulsar, the Windows taskbar system monitor."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    %sveltekit.head%
  </head>
  <body data-route="studio">
    <div id="app">%sveltekit.body%</div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">
        Pulsar Themes needs JavaScript to draw the preview.
      </p>
    </noscript>
  </body>
</html>
