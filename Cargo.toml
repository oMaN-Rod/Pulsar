[workspace]
members = ["crates/pulsar-core", "crates/pulsar-monitor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
description = "A lightweight Windows 11 taskbar monitor for CPU, memory, disk, network, GPU and ping."
repository = "https://github.com/oMaN-Rod/Pulsar"
homepage = "https://github.com/oMaN-Rod/Pulsar"
readme = "README.md"
keywords = ["taskbar", "system-monitor", "windows", "gpu", "performance"]
categories = ["gui", "os::windows-apis"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
log = { version = "0.4", features = ["std"] }
windows = "0.62"
windows-numerics = "0.3"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
slint-build = "1.18"
