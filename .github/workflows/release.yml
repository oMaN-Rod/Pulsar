name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $found = Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue
          if (-not $found) { choco install innosetup -y --no-progress }
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -ExpectVersion $env:TAG
      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ github.ref_name }}
          path: dist/winget
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG (Get-ChildItem dist -File).FullName `
            --repo $env:REPO --draft --title "Pulsar $env:TAG" --generate-notes
